# Personal foot overrides, pulled in by the last line of foot.ini. Keep this
# file limited to what should survive Omarchy's tooling: foot.ini is rewritten
# in place by `omarchy font set` and `omarchy display text size` (both use
# sed -i, which would replace a symlink with a regular file), while nothing
# touches this file.
#
# Included last, so these assignments win over anything set in foot.ini.

[main]
# Size only. The family stays "monospace" on purpose so `omarchy font set`
# keeps working -- it prepends the chosen family for monospace in
# ~/.config/fontconfig/fonts.conf, and foot resolves it through fontconfig.
#
# Note this pins the terminal size, so `omarchy display text size` no longer
# scales foot; it still scales the Omarchy shell and GTK apps.
font=monospace:size=12
